[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judgeguard-alexa-mcp"
version = "1.0.0"
description = "JudgeGuard Alexa+ MCP Server — Autonomous AI Governance & Pre-Action Verification"
readme = "README.md"
authors = [{ name = "JudgeGuard Core Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0"
]

[project.scripts]
judgeguard-mcp = "server:main"
